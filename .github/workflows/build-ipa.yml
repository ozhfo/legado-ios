name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build Legado.app (unsigned)
        run: |
          xcodebuild \
            -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Legado.ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Legado.app"
          test -d "$APP_PATH"
          rm -rf Payload Legado.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Legado.ipa Payload
          ls -lh Legado.ipa

      - name: Upload Legado.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-unsigned-ipa
          path: Legado.ipa
          retention-days: 30
